<!--8<-- [start:diagram]-->
<div class="continuous-testing-embed">
  <style>
    .continuous-testing-embed {
      position: relative;
      width: 100%;
      margin: 1.5rem 0;
    }
    .continuous-testing-embed iframe {
      display: block;
      width: 100%;
      height: 38rem;
      border: 0;
      border-radius: 0.3rem;
    }
    .continuous-testing-embed__fullscreen {
      position: absolute;
      z-index: 2;
      top: 0.75rem;
      right: 0.75rem;
      width: 2.25rem;
      height: 2.25rem;
      display: grid;
      place-items: center;
      border: 1px solid var(--md-default-fg-color--lightest);
      border-radius: 0.4rem;
      background: var(--md-default-bg-color);
      color: var(--md-default-fg-color);
      cursor: pointer;
    }
    .continuous-testing-embed__fullscreen svg {
      width: 1.1rem;
      height: 1.1rem;
    }
    .continuous-testing-embed__fullscreen .ct-close-icon { display: none; }
    .continuous-testing-embed[data-full="true"] .ct-open-icon { display: none; }
    .continuous-testing-embed[data-full="true"] .ct-close-icon { display: block; }
    .continuous-testing-embed[data-full="true"] {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      width: 100%;
      height: 100dvh;
      margin: 0;
      background: var(--md-default-bg-color);
    }
    .continuous-testing-embed[data-full="true"] iframe {
      width: 100%;
      height: 100% !important;
      border-radius: 0;
    }
  </style>
  <button type="button" class="continuous-testing-embed__fullscreen"
          aria-label="Expand diagram" aria-pressed="false" title="Expand diagram">
    <svg class="ct-open-icon" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"
            fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <svg class="ct-close-icon" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor"
            stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>
  <iframe
    title="Continuous Testing: interactive validation map"
    loading="lazy"
    src="../../../assets/html/continuous-testing-map.html?embedded=1&amp;lang=en">
  </iframe>
  <script>
    (() => {
      const container = document.currentScript.parentElement;
      const frame = container.querySelector("iframe");
      const button = container.querySelector(".continuous-testing-embed__fullscreen");
      const spanish = document.documentElement.lang.toLowerCase().startsWith("es");
      let previousOverflow = "";
      function setFullscreen(on) {
        container.dataset.full = String(on);
        button.setAttribute("aria-pressed", String(on));
        const label = on
          ? (spanish ? "Cerrar pantalla completa" : "Close full screen")
          : (spanish ? "Ampliar diagrama" : "Expand diagram");
        button.setAttribute("aria-label", label);
        button.title = label;
        if (on) {
          previousOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";
        } else {
          document.body.style.overflow = previousOverflow;
        }
        frame.contentWindow.postMessage({ type: "ct-embed-fullscreen", active: on }, location.origin);
      }
      if (spanish) {
        button.setAttribute("aria-label", "Ampliar diagrama");
        button.title = "Ampliar diagrama";
      }
      button.addEventListener("click", () => setFullscreen(container.dataset.full !== "true"));
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && container.dataset.full === "true") setFullscreen(false);
      });
      if (document.documentElement.lang.toLowerCase().startsWith("es")) {
        frame.src = "../../../../assets/html/continuous-testing-map.html?embedded=1";
      }
      window.addEventListener("message", (event) => {
        if (event.source !== frame.contentWindow || event.origin !== location.origin || !event.data) return;
        if (event.data.type === "ct-embed-escape" && container.dataset.full === "true") {
          setFullscreen(false);
          return;
        }
        if (event.data.type !== "ct-embed-size" || container.dataset.full === "true") return;
        if (Number.isFinite(event.data.height) && event.data.height > 0) {
          frame.style.height = Math.ceil(event.data.height) + "px";
        }
      });
    })();
  </script>
</div>
<!--8<-- [end:diagram]-->
