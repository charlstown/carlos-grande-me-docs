<svg xmlns="http://www.w3.org/2000/svg" viewBox="39 24 1122 622" width="100%" height="100%" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">

  <!-- ================= MARCO PRINCIPAL: LLAMA 2 70B ================= -->
  <!-- Ancho total = 1120, Alto = 620 | Margen global exterior simétrico -->
  <g transform="translate(40, 25)">
    <!-- Contenedor maestro exterior -->
    <rect width="1120" height="620" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- ================= CABECERA (ENRASADA A X=40 Y X=1080) ================= -->
    <g transform="translate(40, 25)">
      <!-- LADO IZQUIERDO: Icono de red neuronal + Título + Subtítulo -->
      <g>
        <!-- Icono de Red Neuronal / Modelo AI -->
        <rect width="48" height="48" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.75" />
        <g stroke="#2563EB" stroke-width="1.25" opacity="0.85">
          <line x1="14" y1="15" x2="24" y2="19" />
          <line x1="14" y1="15" x2="24" y2="29" />
          <line x1="14" y1="24" x2="24" y2="19" />
          <line x1="14" y1="24" x2="24" y2="29" />
          <line x1="14" y1="33" x2="24" y2="19" />
          <line x1="14" y1="33" x2="24" y2="29" />
          <line x1="24" y1="19" x2="34" y2="24" />
          <line x1="24" y1="29" x2="34" y2="24" />
        </g>
        <!-- Nodos de la red -->
        <circle cx="14" cy="15" r="2.5" fill="#2563EB" />
        <circle cx="14" cy="24" r="2.5" fill="#2563EB" />
        <circle cx="14" cy="33" r="2.5" fill="#2563EB" />
        <circle cx="24" cy="19" r="2.5" fill="#2563EB" />
        <circle cx="24" cy="29" r="2.5" fill="#2563EB" />
        <circle cx="34" cy="24" r="3" fill="#2563EB" />

        <!-- Título y subtítulo limpios a la izquierda -->
        <text x="64" y="22" font-size="24" font-weight="800" fill="#0F172A">Llama 2 70B</text>
        <text x="64" y="42" font-size="14" font-weight="500" fill="#64748B">70.000 millones de parámetros en ejecución</text>
      </g>

      <!-- LADO DERECHO: Etiqueta de Modelo de Lenguaje alineada a la derecha (en X=1040, enrasada con el final de la tarjeta 2) -->
      <g transform="translate(850, 10)">
        <rect width="190" height="28" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <text x="95" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.5">MODELO DE LENGUAJE (LLM)</text>
      </g>
    </g>

    <!-- Línea divisoria enrasada con las dos cajas interiores (de X=40 a X=1080) -->
    <line x1="40" y1="92" x2="1080" y2="92" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- ================= CAJA 1: CÓDIGO (X=40, ANCHO=500, ALTO=450) ================= -->
    <g transform="translate(40, 115)">
      <rect width="500" height="450" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

      <!-- Etiqueta de sección -->
      <rect x="32" y="24" width="150" height="26" rx="6" fill="#EFF6FF" />
      <text x="107" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="0.5">FICHERO DE CÓDIGO</text>

      <!-- Área gráfica: Hoja única de código -->
      <g transform="translate(32, 68)">
        <path d="M 0 0 H 56 L 78 22 V 100 H 0 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
        <path d="M 56 0 V 22 H 78" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />

        <text x="39" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">&lt; / &gt;</text>

        <rect x="10" y="36" width="24" height="3" rx="1.5" fill="#2563EB" />
        <rect x="38" y="36" width="28" height="3" rx="1.5" fill="#94A3B8" />
        <rect x="16" y="46" width="46" height="3" rx="1.5" fill="#CBD5E1" />
        <rect x="16" y="56" width="34" height="3" rx="1.5" fill="#CBD5E1" />
        <rect x="10" y="66" width="18" height="3" rx="1.5" fill="#2563EB" />
        <rect x="10" y="76" width="52" height="3" rx="1.5" fill="#CBD5E1" />
        <rect x="10" y="86" width="40" height="3" rx="1.5" fill="#94A3B8" />

        <g transform="translate(100, 30)">
          <text x="0" y="16" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">ESPACIO EN DISCO</text>
          <text x="0" y="42" font-size="24" font-weight="800" fill="#0F172A">~30 KB</text>
        </g>
      </g>

      <!-- Título descriptivo -->
      <text x="32" y="210" font-size="20" font-weight="700" fill="#0F172A">Código de inferencia</text>
      <text x="32" y="236" font-size="14" fill="#64748B">Define las operaciones para generar predicciones</text>

      <!-- Caja comparativa homogénea -->
      <g transform="translate(32, 280)">
        <rect width="436" height="138" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="24" y="46" font-size="34" font-weight="800" fill="#2563EB">~700</text>
        <text x="135" y="40" font-size="13" font-weight="700" fill="#0F172A">LÍNEAS DE CÓDIGO EN C</text>

        <line x1="24" y1="66" x2="412" y2="66" stroke="#F1F5F9" stroke-width="1.5" />

        <text x="24" y="92" font-size="13.5" font-weight="500" fill="#334155">Unas 700 líneas de C en una implementación sencilla.</text>
        <text x="24" y="114" font-size="13" font-weight="400" fill="#64748B">Contiene la lógica algorítmica de ejecución.</text>
      </g>
    </g>

    <!-- ================= CAJA 2: DATOS (X=580, ANCHO=500, ALTO=450) ================= -->
    <g transform="translate(580, 115)">
      <rect width="500" height="450" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

      <!-- Etiqueta de sección -->
      <rect x="32" y="24" width="150" height="26" rx="6" fill="#EFF6FF" />
      <text x="107" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="0.5">FICHERO DE DATOS</text>

      <!-- Área gráfica: Misma hoja pero apilada en capas -->
      <g transform="translate(32, 68)">
        <g transform="translate(16, -10)">
          <path d="M 0 0 H 56 L 78 22 V 100 H 0 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
          <path d="M 56 0 V 22 H 78" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5" />
        </g>
        <g transform="translate(8, -5)">
          <path d="M 0 0 H 56 L 78 22 V 100 H 0 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
          <path d="M 56 0 V 22 H 78" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
        </g>
        <g transform="translate(0, 0)">
          <path d="M 0 0 H 56 L 78 22 V 100 H 0 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
          <path d="M 56 0 V 22 H 78" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />

          <text x="39" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">[ # ]</text>

          <g font-family="monospace" font-size="7.5" fill="#64748B" font-weight="600">
            <text x="8" y="40">+0.02 -0.19</text>
            <text x="8" y="52">-0.71 +0.45</text>
            <text x="8" y="64">+0.10 -0.01</text>
            <text x="8" y="76">-0.04 +0.31</text>
            <text x="8" y="88" fill="#2563EB">70B valores</text>
          </g>
        </g>

        <g transform="translate(116, 30)">
          <text x="0" y="16" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">ESPACIO EN DISCO</text>
          <text x="0" y="42" font-size="24" font-weight="800" fill="#0F172A">140 GB</text>
        </g>
      </g>

      <!-- Título descriptivo -->
      <text x="32" y="210" font-size="20" font-weight="700" fill="#0F172A">Parámetros o pesos</text>
      <text x="32" y="236" font-size="14" fill="#64748B">Valores numéricos aprendidos durante el entrenamiento</text>

      <!-- Caja comparativa homogénea -->
      <g transform="translate(32, 280)">
        <rect width="436" height="138" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="24" y="46" font-size="34" font-weight="800" fill="#2563EB">140 GB</text>
        <text x="160" y="40" font-size="13" font-weight="700" fill="#0F172A">A 16 BITS POR PARÁMETRO</text>

        <line x1="24" y1="66" x2="412" y2="66" stroke="#F1F5F9" stroke-width="1.5" />

        <text x="24" y="92" font-size="13.5" font-weight="500" fill="#334155">Aproximadamente 140 GB a 16 bits por parámetro.</text>
        <text x="24" y="114" font-size="13" font-weight="400" fill="#64748B">Contiene el conocimiento aprendido del modelo.</text>
      </g>
    </g>

  </g>

</svg>
